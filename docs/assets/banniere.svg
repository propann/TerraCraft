<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="TerraCraft — la Terre réelle après la chute, jusqu'à la Lune et Mars">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.65" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="atmo" cx="0.5" cy="1.9" r="1.25">
      <stop offset="0.7" stop-color="#4fd6ff" stop-opacity="0.45"/>
      <stop offset="0.82" stop-color="#4fd6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset="1" stop-color="#14305e"/>
    </linearGradient>
    <radialGradient id="lune" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e4e4ea"/>
      <stop offset="1" stop-color="#8a8a96"/>
    </radialGradient>
    <radialGradient id="mars" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e07a4f"/>
      <stop offset="1" stop-color="#7a3520"/>
    </radialGradient>
    <clipPath id="planete"><ellipse cx="600" cy="790" rx="860" ry="470"/></clipPath>
    <linearGradient id="flamme" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#ciel)"/>

  <!-- Étoiles -->
  <g fill="#ffffff">
    <rect x="80" y="40" width="3" height="3" opacity="0.9"/><rect x="190" y="110" width="2" height="2" opacity="0.6"/>
    <rect x="300" y="60" width="3" height="3" opacity="0.8"/><rect x="420" y="140" width="2" height="2" opacity="0.5"/>
    <rect x="520" y="30" width="2" height="2" opacity="0.7"/><rect x="640" y="90" width="3" height="3" opacity="0.9"/>
    <rect x="760" y="50" width="2" height="2" opacity="0.6"/><rect x="870" y="130" width="2" height="2" opacity="0.5"/>
    <rect x="1010" y="70" width="3" height="3" opacity="0.8"/><rect x="1130" y="150" width="2" height="2" opacity="0.6"/>
    <rect x="40" y="170" width="2" height="2" opacity="0.5"/><rect x="1160" y="30" width="2" height="2" opacity="0.7"/>
    <rect x="700" y="180" width="2" height="2" opacity="0.4"/><rect x="350" y="200" width="2" height="2" opacity="0.4"/>
  </g>

  <!-- Lune et Mars -->
  <circle cx="1065" cy="90" r="42" fill="url(#lune)"/>
  <rect x="1046" y="76" width="10" height="10" fill="#6e6e78" opacity="0.5"/>
  <rect x="1076" y="98" width="13" height="13" fill="#6e6e78" opacity="0.4"/>
  <circle cx="1130" cy="215" r="18" fill="url(#mars)"/>

  <!-- Terre vue de l'orbite, villes allumées -->
  <ellipse cx="600" cy="760" rx="900" ry="480" fill="url(#atmo)"/>
  <ellipse cx="600" cy="790" rx="860" ry="470" fill="url(#terre)"/>
  <g fill="#3f8f4a" opacity="0.85" clip-path="url(#planete)">
    <rect x="250" y="352" width="140" height="40"/><rect x="290" y="340" width="90" height="16"/>
    <rect x="560" y="330" width="150" height="20"/><rect x="600" y="314" width="70" height="16"/>
    <rect x="830" y="344" width="130" height="40"/>
  </g>
  <g fill="#ffc94a" clip-path="url(#planete)">
    <rect x="318" y="350" width="4" height="4"/><rect x="344" y="362" width="3" height="3"/>
    <rect x="612" y="320" width="4" height="4"/><rect x="640" y="336" width="3" height="3"/><rect x="682" y="334" width="4" height="4"/>
    <rect x="870" y="354" width="3" height="3"/><rect x="902" y="352" width="4" height="4"/>
  </g>

  <!-- Vaisseau construit en blocs -->
  <g transform="translate(180 150) rotate(-18)">
    <rect x="-34" y="20" width="18" height="42" fill="url(#flamme)"/>
    <rect x="16" y="20" width="18" height="42" fill="url(#flamme)"/>
    <rect x="-40" y="-40" width="80" height="60" fill="#e8eaee"/>
    <rect x="-40" y="-14" width="80" height="10" fill="#e8762a"/>
    <rect x="-24" y="-64" width="48" height="24" fill="#5a96cd"/>
    <rect x="-40" y="-64" width="16" height="24" fill="#e8eaee"/>
    <rect x="24" y="-64" width="16" height="24" fill="#e8eaee"/>
    <rect x="-38" y="20" width="22" height="10" fill="#4e5058"/>
    <rect x="16" y="20" width="22" height="10" fill="#4e5058"/>
    <rect x="-56" y="-6" width="16" height="22" fill="#d8dae0"/>
    <rect x="40" y="-6" width="16" height="22" fill="#d8dae0"/>
  </g>

  <!-- Titre -->
  <text x="600" y="150" text-anchor="middle" font-family="'Trebuchet MS', 'DejaVu Sans', sans-serif" font-size="96" font-weight="bold" fill="#ffffff" letter-spacing="6">TERRACRAFT</text>
  <rect x="380" y="168" width="440" height="3" fill="#ffc94a"/>
  <text x="600" y="210" text-anchor="middle" font-family="'Trebuchet MS', 'DejaVu Sans', sans-serif" font-size="26" fill="#dde6ec">La Terre réelle après la chute · de Paris à la Lune et Mars</text>
  <text x="600" y="246" text-anchor="middle" font-family="'Trebuchet MS', 'DejaVu Sans', sans-serif" font-size="18" fill="#8fb6cc">Serveur Minecraft survie · Java 26.3 · Fabric · en français</text>
</svg>
