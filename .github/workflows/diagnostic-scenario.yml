name: Diagnostic temporaire du scénario
on:
  push:
    branches: [ci/fiabilisation-scenarios]
    paths: [.github/workflows/diagnostic-scenario.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lire les exceptions du scénario archivé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43250792124 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/diagnostic"
          python3 - "$RUNNER_TEMP/diagnostic" <<'PY'
          from pathlib import Path
          import sys
          for path in Path(sys.argv[1]).rglob("scenario.log"):
              lines = path.read_text(errors="replace").splitlines()
              indexes = set()
              for i, line in enumerate(lines):
                  if "Exception" in line or "ERROR" in line:
                      indexes.update(range(max(0,i-2), min(len(lines),i+12)))
              for i in sorted(indexes):
                  print(f"{i+1}: {lines[i]}")
          PY
