# Compile le mod à chaque push sur main, met à jour la branche « falix » (déploiement Falix)
# et, pour un tag vX.Y.Z, publie une release avec le jar et le pack client.
name: Build et déploiement

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Compiler le mod
        working-directory: geo-mod
        run: gradle --no-daemon build

      - name: Identité Git du robot
        run: |
          git config user.name "terracraft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mettre à jour la branche falix
        if: github.ref == 'refs/heads/main'
        env:
          GRADLE_BIN: gradle
        run: deploy/make_falix_branch.sh

      - name: Pack client
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' geo-mod/gradle.properties)"
          python3 tools/make_mrpack.py "geo-mod/build/libs/terracraft-geo-$VERSION.jar" dist/TerraCraft-client.mrpack
          cp "geo-mod/build/libs/terracraft-geo-$VERSION.jar" dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "TerraCraft ${GITHUB_REF_NAME#v}" \
            --notes "Joueurs : lancer l'installeur (voir installer/README.md) ou importer TerraCraft-client.mrpack dans Prism / Modrinth App." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
