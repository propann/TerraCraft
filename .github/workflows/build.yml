# Compile le mod à chaque push sur main, met à jour la branche « falix » (déploiement Falix)
# et, pour un tag vX.Y.Z, publie une release avec le jar et le pack client.
# Sur une pull request : mêmes contrôles (ressources, compilation, démarrage du serveur),
# sans rien déployer ni publier — les étapes de déploiement ne tournent que sur main et les tags.
name: Build et déploiement

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un nouveau push sur la même PR annule la vérification précédente ; main et les tags vont toujours au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Ressources complètes (traductions, modèles, textures)
        run: python3 tools/check_assets.py

      - name: Recettes valides et objets obtenables
        run: python3 tools/check_recipes.py

      - name: Compiler le mod
        working-directory: geo-mod
        run: gradle --no-daemon build

      # Démarre un vrai serveur avec le jar compilé et les mods figés : si le serveur ne
      # démarre pas (données invalides, crash au chargement), rien n'est déployé sur Falix.
      - name: Test de démarrage du serveur
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' geo-mod/gradle.properties)"
          tools/smoke_server.sh "geo-mod/build/libs/terracraft-geo-$VERSION.jar" "$RUNNER_TEMP/smoke"

      - name: Identité Git du robot
        run: |
          git config user.name "terracraft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mettre à jour la branche falix
        if: github.ref == 'refs/heads/main'
        env:
          GRADLE_BIN: gradle
          SKIP_SMOKE: "1"
        run: deploy/make_falix_branch.sh

      - name: Pack client
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' geo-mod/gradle.properties)"
          python3 tools/make_mrpack.py "geo-mod/build/libs/terracraft-geo-$VERSION.jar" dist/TerraCraft-client.mrpack
          cp "geo-mod/build/libs/terracraft-geo-$VERSION.jar" dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "TerraCraft ${GITHUB_REF_NAME#v}" \
            --notes "Joueurs : lancer l'installeur (voir installer/README.md) ou importer TerraCraft-client.mrpack dans Prism / Modrinth App." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
