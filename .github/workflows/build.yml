# Compile le mod à chaque push sur main, met à jour la branche « falix » (déploiement Falix)
# et, pour un tag vX.Y.Z, publie une release avec le jar et le pack client.
name: Build et déploiement

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Les PR devenues obsolètes sont annulées ; un déploiement commencé va au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Scripts des serveurs de test
        run: |
          bash -n tools/test-server-lib.sh tools/smoke_server.sh tools/scenario_test.sh tools/geo_bench.sh
          python3 -m unittest discover -s tools/tests -v

      - name: Ressources complètes (traductions, modèles, textures)
        run: python3 tools/check_assets.py

      - name: Recettes valides et objets obtenables
        run: python3 tools/check_recipes.py

      - name: Compiler le mod
        working-directory: geo-mod
        run: gradle --no-daemon build

      - name: PNJ avec modèle simulé et redémarrage
        run: |
          bash -n tools/npc-scenario-test.sh
          VERSION="$(sed -n 's/^mod_version=//p' geo-mod/gradle.properties)"
          tools/npc-scenario-test.sh "geo-mod/build/libs/terracraft-geo-$VERSION.jar" "$RUNNER_TEMP/terracraft-npc"

      # Le scénario inclut le démarrage ; toute erreur bloque Falix et les releases.
      - name: Scénario multijoueur complet
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' geo-mod/gradle.properties)"
          tools/scenario_test.sh "geo-mod/build/libs/terracraft-geo-$VERSION.jar" "$RUNNER_TEMP/terracraft-test"

      - name: Journaux du serveur en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: journaux-serveur-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/terracraft-test/console.log
            ${{ runner.temp }}/terracraft-test/scenario.log
            ${{ runner.temp }}/terracraft-test/logs/*.log
            ${{ runner.temp }}/terracraft-test/crash-reports/*.txt
            ${{ runner.temp }}/terracraft-npc/*.log
            ${{ runner.temp }}/terracraft-npc/logs/*.log
            geo-mod/build/test-results/test/*.xml
            geo-mod/build/reports/tests/test/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Identité Git du robot
        run: |
          git config user.name "terracraft-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mettre à jour la branche falix
        if: github.ref == 'refs/heads/main'
        env:
          GRADLE_BIN: gradle
          SKIP_SMOKE: "1"
        run: deploy/make_falix_branch.sh

      - name: Pack client
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' geo-mod/gradle.properties)"
          python3 tools/make_mrpack.py "geo-mod/build/libs/terracraft-geo-$VERSION.jar" dist/TerraCraft-client.mrpack
          cp "geo-mod/build/libs/terracraft-geo-$VERSION.jar" dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "TerraCraft ${GITHUB_REF_NAME#v}" \
            --notes "Joueurs : lancer l'installeur (voir installer/README.md) ou importer TerraCraft-client.mrpack dans Prism / Modrinth App." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber

